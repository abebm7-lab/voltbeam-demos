  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    const c = (n) => `rgb(var(--c-${n}) / <alpha-value>)`;
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            fondo: c("fondo"), superficie: c("superficie"), linea: c("linea"),
            acento: c("acento"), acentoSuave: c("acentoSuave"),
            texto: c("texto"), textoSuave: c("textoSuave")
          },
          fontFamily: { sans: ["'Bricolage Grotesque'", "system-ui", "sans-serif"] }
        }
      }
    };
  </script>

  <style>
    html { background: #fff; color: #1B1320; scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body { opacity: 0; transition: opacity .25s ease; }
    body.listo { opacity: 1; }
    [id] { scroll-margin-top: 128px; }
    :focus-visible { outline: 2px solid rgb(var(--c-acento)); outline-offset: 3px; border-radius: 10px; }
    .sin-barra { scrollbar-width: none; } .sin-barra::-webkit-scrollbar { display: none; }
    body.carrito-activo .vb-launcher { bottom: 6rem; }
    .hoja { transition: transform .28s cubic-bezier(.2,.8,.2,1), opacity .2s; }
    .hoja[data-open="false"] { transform: translateY(100%); opacity: 0; pointer-events: none; visibility: hidden; }
    .velo { transition: opacity .2s; }
    .velo[data-open="false"] { opacity: 0; pointer-events: none; visibility: hidden; }
    @media (prefers-reduced-motion: reduce) { .hoja, .velo { transition: none; } }
