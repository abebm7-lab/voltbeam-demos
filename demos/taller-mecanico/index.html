  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    const c = (n) => `rgb(var(--c-${n}) / <alpha-value>)`;
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            fondo: c("fondo"), superficie: c("superficie"), linea: c("linea"),
            acento: c("acento"), acentoSuave: c("acentoSuave"),
            texto: c("texto"), textoSuave: c("textoSuave")
          },
          fontFamily: {
            display: ["'Barlow Condensed'", "system-ui", "sans-serif"],
            sans: ["Barlow", "system-ui", "sans-serif"]
          }
        }
      }
    };
  </script>

  <style>
    html { background: #ECEEF0; color: #15181C; scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body { opacity: 0; transition: opacity .25s ease; }
    body.listo { opacity: 1; }
    [id] { scroll-margin-top: 76px; }
    :focus-visible { outline: 3px solid rgb(var(--c-acento)); outline-offset: 2px; }
    /* Franja de precaución */
    .franja { background: repeating-linear-gradient(-45deg, rgb(var(--c-acento)) 0 14px, rgb(var(--c-texto)) 14px 28px); }
    input[type=number]::-webkit-inner-spin-button { opacity: .4; }
  </style>
</head>
<body class="bg-fondo text-texto font-sans antialiased">

  <script src="./bot.js"></script>
  <script src="./app.js"></script>
</body>
</html>
